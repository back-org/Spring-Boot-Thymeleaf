spring.application.name=simplerest
server.port=8082

# Database
spring.datasource.url=jdbc:mysql://localhost:3306/employees?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USER:user}
spring.datasource.password=${DB_PASS:password}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Thymeleaf
spring.thymeleaf.cache=false

# Actuator
management.server.port=9090
management.endpoints.web.exposure.include=health,info,metrics,prometheus,env,loggers,threaddump

# Swagger (si activé via springdoc)
springdoc.show-actuator=true
springdoc.use-management-port=true

# Logging
logging.file.name=logs/app.log
logging.level.org.springframework.web=INFO
logging.level.org.hibernate.SQL=DEBUG

# JWT (Base64)
security.jwt.secret=REPLACE_WITH_BASE64_SECRET
security.jwt.expiration-ms=86400000

